name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check imports
        run: |
          python -c "from step2api.core.config import config; print('Config OK')"
          python -c "from step2api.core.pool import pool; print('Pool OK')"
          python -c "from step2api.stepfun.chat import encode_connect_message, encode_connect_end_stream; print('Chat OK')"
          python -c "from step2api.main import app; print('App OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --asyncio-mode=auto 2>/dev/null || echo "No tests yet"
