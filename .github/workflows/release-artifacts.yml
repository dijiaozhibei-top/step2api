name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  # ─── Build binary packages (PyInstaller) ───
  build-binaries:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            artifact_name: linux_amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: linux_arm64
          - os: macos-latest
            arch: amd64
            artifact_name: darwin_amd64
          - os: macos-latest
            arch: arm64
            artifact_name: darwin_arm64
          - os: windows-latest
            arch: amd64
            artifact_name: windows_amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name step2api src/step2api/main.py

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist-pkg/step2api
          cp -r dist/step2api* dist-pkg/step2api/
          cp config.example.json dist-pkg/step2api/
          cp .env.example dist-pkg/step2api/
          cp README.md dist-pkg/step2api/
          cp LICENSE dist-pkg/step2api/ 2>/dev/null || true

      - name: Create archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist-pkg
          tar -czf "../step2api_${{ github.ref_name }}_${{ matrix.artifact_name }}.tar.gz" step2api
          cd ..

      - name: Create archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-pkg\step2api\*" -DestinationPath "step2api_${{ github.ref_name }}_${{ matrix.artifact_name }}.zip"

      - name: Upload release artifact
        uses: actions/upload-release-asset@v1
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ runner.os == 'Windows' && format('step2api_{0}_{1}.zip', github.ref_name, matrix.artifact_name) || format('step2api_{0}_{1}.tar.gz', github.ref_name, matrix.artifact_name) }}
          asset_name: ${{ runner.os == 'Windows' && format('step2api_{0}_{1}.zip', github.ref_name, matrix.artifact_name) || format('step2api_{0}_{1}.tar.gz', github.ref_name, matrix.artifact_name) }}
          asset_content_type: ${{ runner.os == 'Windows' && 'application/zip' || 'application/gzip' }}

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: step2api_${{ matrix.artifact_name }}
          path: ${{ runner.os == 'Windows' && format('step2api_{0}_{1}.zip', github.ref_name, matrix.artifact_name) || format('step2api_{0}_{1}.tar.gz', github.ref_name, matrix.artifact_name) }}

  # ─── Build and push Docker image ───
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
